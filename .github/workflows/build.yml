name: Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Restrict default token permissions to read-only; individual jobs escalate as needed.
permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Android: build debug APK and run unit tests
  # ──────────────────────────────────────────────────────────────────────────
  android:
    name: Android – Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to post the commit comment

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew :androidApp:test :shared:test --no-configuration-cache

      - name: Build debug APK
        run: ./gradlew :androidApp:assembleDebug --no-configuration-cache

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: webforge-studio-debug-${{ github.run_number }}
          path: androidApp/build/outputs/apk/debug/*.apk
          retention-days: 14

      # Posts an APK download link as a commit comment when a push lands on main.
      # Pull-request builds skip this step — the artifact is accessible from the
      # workflow summary page instead.
      - name: Comment APK download link on commit
        if: github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl =
              `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: `✅ **Build #${context.runNumber} succeeded!**\n\n` +
                    `Download the debug APK from the [workflow artifacts](${runUrl}).`,
            });

  # ──────────────────────────────────────────────────────────────────────────
  # iOS: KMP shared module compile check (disabled by default)
  #
  # Prerequisites before enabling:
  #   1. Add iosSimulatorArm64() / iosArm64() targets to shared/build.gradle.kts
  #   2. Change `if: false` to `if: true` (or remove the condition entirely)
  #
  # This job must run on macos-latest because Kotlin/Native requires macOS
  # to compile iOS targets.
  # ──────────────────────────────────────────────────────────────────────────
  ios:
    name: iOS – KMP Shared Compile Check
    if: false # ← set to true once iOS targets are added to shared/build.gradle.kts
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compile KMP shared module for iOS Simulator
        run: ./gradlew :shared:compileKotlinIosSimulatorArm64 --no-configuration-cache

  # ──────────────────────────────────────────────────────────────────────────
  # Desktop: Compose Desktop JAR build (disabled by default)
  #
  # Prerequisites before enabling:
  #   1. Add a :desktopApp module with the compose.desktop Gradle plugin
  #   2. Add the jvm() target to shared/build.gradle.kts
  #   3. Change `if: false` to `if: true` (or remove the condition entirely)
  # ──────────────────────────────────────────────────────────────────────────
  desktop:
    name: Desktop – Compose Desktop JAR
    if: false # ← set to true once a :desktopApp module is configured
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Desktop release JAR
        run: ./gradlew :desktopApp:packageReleaseUberJarForCurrentOS --no-configuration-cache

      - name: Upload Desktop JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: webforge-studio-desktop-${{ github.run_number }}
          path: desktopApp/build/compose/jars/*.jar
          retention-days: 14
